name: Repair legacy Ruff only on live-ops feature branch

on:
  push:
    branches:
      - feature/gtc-live-ops-audit-20261020
    paths:
      - ".github/workflows/repair-legacy-ruff.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'thomasdgn/bloomberg-trading-challenge-quant-lab' && github.ref == 'refs/heads/feature/gtc-live-ops-audit-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install EXISTING project dependencies
        run: python -m pip install -r requirements.txt
      - name: Format only five identified pre-existing sources
        run: |
          python -m ruff format \
            src/compare_backtest_horizons.py \
            src/export_clean_allocations.py \
            src/opportunistic_model.py \
            src/refresh_feature_market_data.py \
            src/weekly_data_update.py
      - name: Check unchanged root lint/format rules
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests
          python -m pip check
      - name: Validate ALL repo tests before any commit
        run: python -m pytest -q
      - name: Commit only five formatting fixes on exact feature branch
        shell: bash
        run: |
          if ! git diff --quiet -- src; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- \
              src/compare_backtest_horizons.py \
              src/export_clean_allocations.py \
              src/opportunistic_model.py \
              src/refresh_feature_market_data.py \
              src/weekly_data_update.py
            git commit -m "style(ci): resolve five preexisting Ruff formatting failures"
            git push origin HEAD:refs/heads/feature/gtc-live-ops-audit-20261020
          fi
