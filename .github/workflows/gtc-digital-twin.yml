name: GTC Digital Twin — safety and demo

on:
  push:
    branches:
      - feature/gtc-digital-twin-20261021
    paths:
      - "tools/gtc_twin/**"
      - "docs/gtc_digital_twin.md"
      - ".github/workflows/gtc-digital-twin.yml"
  pull_request:
    paths:
      - "tools/gtc_twin/**"
      - ".github/workflows/gtc-digital-twin.yml"

permissions:
  contents: read

jobs:
  research-safety:
    name: Paired simulation / journal tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned project dependencies
        run: python -m pip install -r requirements.txt
      - name: Check source, inputs and standalone CLI
        run: |
          python -m pip check
          python -m ruff check tools/gtc_twin
          python -m ruff format --check tools/gtc_twin
          python -m compileall -q tools/gtc_twin
          python -m tools.gtc_twin --help
      - name: Unit and robustness tests
        run: python -m pytest -q tools/gtc_twin/tests
      - name: Reproducible fully synthetic investor-facing dashboard
        run: |
          python -m tools.gtc_twin.demo --output outputs/gtc_twin/demo-input.json
          python -m tools.gtc_twin simulate --input outputs/gtc_twin/demo-input.json --output outputs/gtc_twin/reviewer-demo
          test -s outputs/gtc_twin/reviewer-demo/report.html
          test -s outputs/gtc_twin/reviewer-demo/simulation.json
      - name: Publish fictional HTML demo only
        uses: actions/upload-artifact@v4
        with:
          name: gtc-digital-twin-synthetic-demo
          path: outputs/gtc_twin/reviewer-demo/
          retention-days: 14
