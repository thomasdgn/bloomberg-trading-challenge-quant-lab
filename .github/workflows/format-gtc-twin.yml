name: Temporary twin-only formatter (never main)

on:
  push:
    branches:
      - feature/gtc-digital-twin-20261021
    paths:
      - ".github/workflows/format-gtc-twin.yml"

permissions:
  contents: write

jobs:
  isolated-format:
    if: github.repository == 'thomasdgn/bloomberg-trading-challenge-quant-lab' && github.ref == 'refs/heads/feature/gtc-digital-twin-20261021'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.txt
      - name: Format ONLY newly added twin package
        run: python -m ruff format tools/gtc_twin
      - name: Check only the formatted package
        run: |
          python -m ruff check tools/gtc_twin
          python -m ruff format --check tools/gtc_twin
      - name: Unit tests required before formatting commit
        run: python -m pytest -q tools/gtc_twin/tests
      - name: Synthetic simulation smoke test
        run: |
          python -m tools.gtc_twin.demo --output outputs/gtc_twin/demo-input.json
          python -m tools.gtc_twin simulate --input outputs/gtc_twin/demo-input.json --output outputs/gtc_twin/demo-report
      - name: Push formatting to THIS branch only
        shell: bash
        run: |
          if ! git diff --quiet -- tools/gtc_twin; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- tools/gtc_twin
            git commit -m "style(twin): apply Ruff formatting after all safety tests"
            git push origin HEAD:refs/heads/feature/gtc-digital-twin-20261021
          fi
