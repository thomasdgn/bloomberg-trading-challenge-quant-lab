name: Format live-ops branch safely

on:
  push:
    branches:
      - feature/gtc-live-ops-audit-20261020
    paths:
      - ".github/workflows/format-live-ops.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'thomasdgn/bloomberg-trading-challenge-quant-lab' && github.ref == 'refs/heads/feature/gtc-live-ops-audit-20261020'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install "pytest>=8,<10" "ruff>=0.14,<0.18"
      - name: Format ONLY isolated live-ops modules
        run: python -m ruff format tools/gtc_live
      - name: Lint formatting output
        run: python -m ruff check tools/gtc_live
      - name: Verify safety tests before any push
        run: python -m pytest -q tools/gtc_live/tests
      - name: Commit formatting only to explicitly named feature branch
        shell: bash
        run: |
          if ! git diff --quiet -- tools/gtc_live; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- tools/gtc_live
            git commit -m "style(live-ops): apply verified Ruff formatting"
            git push origin HEAD:refs/heads/feature/gtc-live-ops-audit-20261020
          fi
